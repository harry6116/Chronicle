name: Chronicle website
on:
  push:
    branches: [main]
    paths:
      - 'docs/public/index.html'
      - 'docs/public/showcase_assets/**'
      - 'docs/public/showcase_samples/**'
      - 'docs/user/chronicle_help.html'
      - 'docs/policies/DISCLAIMER.md'
      - 'tools/build_pages_site.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited, released, unpublished, deleted]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'harry6116/Chronicle' &&
      (github.event_name != 'release' || github.event.action == 'deleted' ||
       github.event.action == 'unpublished' ||
       (!github.event.release.draft && !github.event.release.prerelease))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/harry6116/Chronicle/releases/latest > "$RUNNER_TEMP/chronicle-release.json"
      - name: Prepare website
        run: python tools/build_pages_site.py --release-json "$RUNNER_TEMP/chronicle-release.json" --output "$RUNNER_TEMP/chronicle-site"
      - name: Deploy Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.159.0"
          command: pages deploy "${{ runner.temp }}/chronicle-site" --project-name=chronicle-vir --branch=main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/chronicle-site
      - uses: actions/deploy-pages@v4
        id: deployment
